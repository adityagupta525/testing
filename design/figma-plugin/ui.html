<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body {
    margin: 0;
    padding: 16px;
    font-family: Inter, -apple-system, sans-serif;
    font-size: 12px;
    background: #FAF7F1;
    color: #1F2024;
  }
  h1 { margin: 0 0 4px; font-size: 14px; font-weight: 700; }
  .sub { color: #6B6E78; margin-bottom: 14px; font-size: 11px; }
  .section { border-top: 1px solid #ECE7DA; padding-top: 12px; margin-top: 12px; }
  .section h2 { margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #6B6E78; font-weight: 600; }
  .step-num { display: inline-block; width: 18px; height: 18px; border-radius: 50%; background: #2A2C32; color: #FAF7F1; text-align: center; line-height: 18px; font-size: 10px; font-weight: 700; margin-right: 6px; vertical-align: middle; }
  button {
    width: 100%;
    height: 36px;
    padding: 0 12px;
    border-radius: 6px;
    border: 1px solid #2A2C32;
    background: #FAF7F1;
    color: #1F2024;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 6px;
  }
  button.primary { background: #2A2C32; color: #FAF7F1; }
  button.gold    { background: #F4D58A; border-color: #B8911C; color: #7A5A1E; }
  button:hover { background: #F2EEE3; }
  button.primary:hover { background: #1F2024; }
  button.gold:hover { background: #EFC56C; }
  select {
    width: 100%; height: 32px; padding: 0 8px;
    border-radius: 6px; border: 1px solid #6B6E78;
    background: #FAF7F1; font-size: 12px; margin-bottom: 8px;
  }
  #log {
    margin-top: 12px; padding: 8px;
    background: #F2EEE3; border-radius: 4px;
    font-family: ui-monospace, Menlo, monospace;
    font-size: 10px; line-height: 1.5; color: #3D3F46;
    max-height: 200px; overflow-y: auto; white-space: pre-wrap;
  }
  .ok   { color: #2C5A2A; }
  .err  { color: #7A1F15; }
  .warn { color: #7B3F12; }
</style>
</head>
<body>
  <h1>Centricity NRI · Onboarding Builder</h1>
  <div class="sub">Tokens + 18 onboarding frames, self-contained.</div>

  <div class="section">
    <h2><span class="step-num">1</span>Setup design tokens</h2>
    <button id="setup-vars" class="primary">Setup variables</button>
  </div>

  <div class="section">
    <h2><span class="step-num">2</span>Build all 18 screens</h2>
    <button id="build-all" class="gold">Build entire onboarding flow</button>
  </div>

  <div class="section">
    <h2><span class="step-num">3</span>Or build one</h2>
    <select id="screen-select">
      <option value="S-01">S-01 · Splash</option>
      <option value="S-02">S-02 · Value Prop</option>
      <option value="S-03">S-03 · Sign In</option>
      <option value="O-01">O-01 · Mobile OTP</option>
      <option value="O-02">O-02 · Email OTP</option>
      <option value="O-03">O-03 · Country</option>
      <option value="O-04">O-04 · PFIC Disclosure</option>
      <option value="O-05">O-05 · PAN</option>
      <option value="O-06a">O-06a · CKYCR fast-track</option>
      <option value="O-08">O-08 · Passport OCR</option>
      <option value="O-08c">O-08c · Video KYC</option>
      <option value="O-09a">O-09a · Bank · form</option>
      <option value="O-09b">O-09b · Bank · verifying</option>
      <option value="O-09c">O-09c · Bank · verified</option>
      <option value="O-10">O-10 · Risk Profile</option>
      <option value="O-11">O-11 · Nominee</option>
      <option value="O-12">O-12 · Review + eSign</option>
      <option value="O-13">O-13 · Account Active</option>
    </select>
    <button id="build-one">Build selected screen</button>
  </div>

  <div id="log">Ready. Click "Setup variables" first (only once per file).</div>

<script>
  const log = document.getElementById('log');
  function append(msg, cls) {
    const line = document.createElement('div');
    if (cls) line.className = cls;
    line.textContent = msg;
    log.appendChild(line);
    log.scrollTop = log.scrollHeight;
  }
  function clearLog() { log.innerHTML = ''; }

  document.getElementById('setup-vars').onclick = () => {
    clearLog();
    parent.postMessage({ pluginMessage: { type: 'setup-variables' } }, '*');
  };
  document.getElementById('build-all').onclick = () => {
    clearLog();
    parent.postMessage({ pluginMessage: { type: 'build-all' } }, '*');
  };
  document.getElementById('build-one').onclick = () => {
    clearLog();
    const sel = document.getElementById('screen-select').value;
    parent.postMessage({ pluginMessage: { type: 'build', screen: sel } }, '*');
  };

  window.onmessage = (e) => {
    const m = e.data.pluginMessage;
    if (!m) return;
    if (m.type === 'log')  append(m.text, m.level || '');
    if (m.type === 'done') append('— Done —', 'ok');
  };
</script>
</body>
</html>

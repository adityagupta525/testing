<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body {
    margin: 0;
    padding: 16px;
    font-family: Inter, -apple-system, sans-serif;
    font-size: 12px;
    background: #FAF7F1;
    color: #1F2024;
  }
  h1 { margin: 0 0 4px; font-size: 14px; font-weight: 700; }
  .sub { color: #6B6E78; margin-bottom: 14px; font-size: 11px; }
  .section { border-top: 1px solid #ECE7DA; padding-top: 12px; margin-top: 12px; }
  .section h2 { margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #6B6E78; font-weight: 600; }
  .step-num { display: inline-block; width: 18px; height: 18px; border-radius: 50%; background: #2A2C32; color: #FAF7F1; text-align: center; line-height: 18px; font-size: 10px; font-weight: 700; margin-right: 6px; vertical-align: middle; }
  button {
    width: 100%;
    height: 36px;
    padding: 0 12px;
    border-radius: 6px;
    border: 1px solid #2A2C32;
    background: #FAF7F1;
    color: #1F2024;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 6px;
  }
  button.primary { background: #2A2C32; color: #FAF7F1; }
  button:hover { background: #F2EEE3; }
  button.primary:hover { background: #1F2024; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  #log {
    margin-top: 12px;
    padding: 8px;
    background: #F2EEE3;
    border-radius: 4px;
    font-family: ui-monospace, Menlo, monospace;
    font-size: 10px;
    line-height: 1.5;
    color: #3D3F46;
    max-height: 220px;
    overflow-y: auto;
    white-space: pre-wrap;
  }
  .ok   { color: #2C5A2A; }
  .err  { color: #7A1F15; }
  .warn { color: #7B3F12; }
</style>
</head>
<body>
  <h1>Centricity NRI · Onboarding Builder</h1>
  <div class="sub">Creates design tokens + draws onboarding screens.</div>

  <div class="section">
    <h2><span class="step-num">1</span>Setup design tokens</h2>
    <button id="setup-vars" class="primary">Setup variables</button>
  </div>

  <div class="section">
    <h2><span class="step-num">2</span>Build splash (first cut)</h2>
    <button id="build-s01" class="primary">Build S-01 · Splash</button>
  </div>

  <div class="section">
    <h2><span class="step-num">3</span>After your approval</h2>
    <button disabled>Build all 17 remaining screens (locked until S-01 approved)</button>
  </div>

  <div id="log">Ready. Click "Setup variables" first.</div>

<script>
  const log = document.getElementById('log');
  function append(msg, cls) {
    const line = document.createElement('div');
    if (cls) line.className = cls;
    line.textContent = msg;
    log.appendChild(line);
    log.scrollTop = log.scrollHeight;
  }
  function clearLog() { log.innerHTML = ''; }

  document.getElementById('setup-vars').onclick = () => {
    clearLog();
    parent.postMessage({ pluginMessage: { type: 'setup-variables' } }, '*');
  };
  document.getElementById('build-s01').onclick = () => {
    clearLog();
    parent.postMessage({ pluginMessage: { type: 'build', screen: 'S-01' } }, '*');
  };

  window.onmessage = (e) => {
    const m = e.data.pluginMessage;
    if (!m) return;
    if (m.type === 'log')  append(m.text, m.level || '');
    if (m.type === 'done') append('— Done —', 'ok');
  };
</script>
</body>
</html>
